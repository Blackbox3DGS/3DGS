<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3DGS 주차장 — 포인트클라우드 뷰어</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="info"><h1>AI 공학관 주차장 · 포인트클라우드</h1><div id="status">로딩 중…</div></div>
  <div id="panel">
    <button id="playBtn">⏸ 일시정지</button>
    <label>점크기 <input id="psize" type="range" min="0.3" max="4" step="0.1" value="1.2" /></label>
    <label>속도 <input id="speed" type="range" min="0.1" max="5" step="0.1" value="1" /></label>
    <label><input id="togglePath" type="checkbox" checked /> 경로</label>
    <label><input id="toggleGrid" type="checkbox" checked /> 격자</label>
    <label><input id="bright" type="checkbox" /> 어둡게</label>
    <div id="frameInfo">frame 0 / 0</div>
  </div>
  <canvas id="canvas"></canvas>
  <script type="module" src="main.js"></script>
</body>
</html>
