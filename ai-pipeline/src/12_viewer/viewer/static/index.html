<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>3DGS Scene Replay — accident reconstruction</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #111; color: #eee;
                 font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
    #app { position: absolute; inset: 0; }
    #hud {
      position: absolute; left: 12px; top: 12px; z-index: 5;
      background: rgba(0,0,0,0.55); padding: 10px 14px; border-radius: 8px;
      font-size: 13px; line-height: 1.5; user-select: none;
    }
    #hud b { color: #6cf; }
    #controls {
      position: absolute; left: 12px; bottom: 12px; right: 12px; z-index: 5;
      display: flex; gap: 10px; align-items: center;
      background: rgba(0,0,0,0.55); padding: 10px 14px; border-radius: 8px;
    }
    #play { background: #6cf; color: #003; border: 0; padding: 6px 14px;
            border-radius: 4px; cursor: pointer; font-weight: 600; }
    #play:hover { background: #9df; }
    #scrub { flex: 1; }
    #status { position: absolute; right: 12px; top: 12px; z-index: 5;
              background: rgba(0,0,0,0.55); padding: 8px 12px; border-radius: 6px;
              font-size: 12px; color: #ccc; }
    .err { color: #f88; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <b>3DGS replay</b><br/>
    Drag = orbit · Right-drag = pan · Scroll = zoom
  </div>
  <div id="status">Loading…</div>
  <div id="controls">
    <button id="play">▶ Play</button>
    <input id="scrub" type="range" min="0" max="100" value="0" step="0.1" />
    <span id="time">0.00 s</span>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "@mkkellogg/gaussian-splats-3d": "https://unpkg.com/@mkkellogg/gaussian-splats-3d@0.4.6/build/gaussian-splats-3d.module.js"
      }
    }
  </script>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
