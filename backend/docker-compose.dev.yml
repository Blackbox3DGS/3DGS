# 로컬 개발용 인프라 (MySQL + Redis). 백엔드 application.yml 기본값과 맞춤.
#   docker compose -f docker-compose.dev.yml up -d
# DB_PASSWORD 는 application-secret.yml 의 값과 동일해야 함(localdevpw).
services:
  mysql:
    image: mysql:8.0
    container_name: youthfi-mysql
    environment:
      MYSQL_ROOT_PASSWORD: localdevpw
      MYSQL_DATABASE: youthfi_db
      TZ: Asia/Seoul
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - youthfi-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocaldevpw"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: youthfi-redis
    ports:
      - "6379:6379"

volumes:
  youthfi-mysql-data:
